version: '3.8'

services:
  # Privacy Audit API
  api:
    build: .
    container_name: privacy-audit-api
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/app/models/cache
    command: python -m uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  # Dashboard
  dashboard:
    build: .
    container_name: privacy-audit-dashboard
    ports:
      - "8050:8050"
    volumes:
      - ./outputs:/app/outputs
    command: python src/dashboard.py --port 8050
    restart: unless-stopped
    depends_on:
      - api
  
  # Optional: Redis for job queue (production)
